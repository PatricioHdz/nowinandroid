version: "1.0"
ruleGroups:
  # --------------------------------------------------------------------------
  # 1. Incompatibilidad de versión de JVM
  #    (el primer error real que encontramos: "Gradle requires JVM 17...")
  #    Va PRIMERO porque su texto ("requires JVM") es muy específico y no
  #    se superpone con ninguna otra regla.
  # --------------------------------------------------------------------------
  - name: "Incompatible JVM Version"
    conditionExpression:
      operator: "OR"
      conditions:
        - key: "standardOutput"
          operand: "contains"
          value: "requires JVM"
        - key: "standardErrorOutput"
          operand: "contains"
          value: "requires JVM"
    actions:
      - type: "setErrorCategory"
        value: "CONFIGURATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "PLUGIN_CONFIGURATION_INVALID"
      - type: "setErrorMessage"
        value: "[ERR-1501] Versión de JVM incompatible con Gradle."
        
  # --------------------------------------------------------------------------
  # 2. Android SDK no encontrado
  #    (el segundo error real: "SDK location not found")
  #    También muy específico, va antes de las reglas genéricas de build.
  # --------------------------------------------------------------------------
  - name: "Android SDK Not Found"
    conditionExpression:
      operator: "OR"
      conditions:
        - key: "standardOutput"
          operand: "contains"
          value: "SDK location not found"
        - key: "standardErrorOutput"
          operand: "contains"
          value: "SDK location not found"
    actions:
      - type: "setErrorCategory"
        value: "CONFIGURATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "PLUGIN_CONFIGURATION_INVALID"
      - type: "setErrorMessage"
        value: "[ERR-1502] Android SDK no encontrado en el contenedor. Verifica ANDROID_HOME/ANDROID_SDK_ROOT o usa una imagen con el SDK preinstalado."

  # --------------------------------------------------------------------------
  # 2. Catch-all — SIEMPRE al final. Captura cualquier fallo que no haya
  #    coincidido con ninguna regla anterior, para que nada quede sin
  #    categorizar.
  # --------------------------------------------------------------------------
  - name: "Uncategorized Failure"
    conditionExpression:
      key: "errorCode"
      operand: "isNot"
      value: 0
    actions:
      - type: "setErrorCategory"
        value: "UNKNOWN_FAILURE"
      - type: "setErrorMessage"
        value: "[ERR-9999] Fallo no clasificado. Revisar logs completos del step."
